name: Test WebM Generation

on:
  workflow_dispatch:

jobs:
  generate-webm:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright

      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium

      - name: Generate One WebM
        run: |
          mkdir -p output

          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {

            const browser = await chromium.launch({
              headless: true,
              args: [
                '--autoplay-policy=no-user-gesture-required',
                '--use-fake-ui-for-media-stream'
              ]
            });

            const context = await browser.newContext({
              acceptDownloads: true,
              viewport: {
                width: 1080,
                height: 1920
              }
            });

            const page = await context.newPage();

            page.on('console', msg => {
              console.log(
                '[BROWSER]',
                msg.type(),
                msg.text()
              );
            });

            page.on('pageerror', error => {
              console.error(
                '[PAGE ERROR]',
                error.message
              );
            });

            console.log('Opening Ayah Fi Daqiqa...');

            await page.goto(
              'https://khaled.elevatefollowers.com/',
              {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              }
            );

            await page.waitForTimeout(8000);

            console.log('Site loaded.');

            /*
             * STEP 1
             * Open the batch generator.
             */
            const batchButton = page.getByRole(
              'button',
              {
                name: /مولد فيديوهات القرآن التلقائي/
              }
            );

            await batchButton.click();

            console.log(
              'Batch generator opened.'
            );

            await page.waitForTimeout(3000);

            /*
             * STEP 2
             * Inspect all selects AFTER opening
             * the batch generator.
             */
            const selectCount =
              await page.locator('select').count();

            console.log(
              'Total select elements:',
              selectCount
            );

            /*
             * Helper:
             * find a select containing an option
             * with the requested text.
             */
            async function selectContaining(text) {

              const selects =
                page.locator('select');

              const count =
                await selects.count();

              for (let i = 0; i < count; i++) {

                const select =
                  selects.nth(i);

                const options =
                  await select.locator(
                    'option'
                  ).allTextContents();

                const match =
                  options.find(option =>
                    option
                      .trim()
                      .includes(text)
                  );

                if (match) {

                  console.log(
                    `Found "${text}" in select #${i}:`,
                    match.trim()
                  );

                  await select.evaluate(
                    (el, wanted) => {

                      const option =
                        [...el.options].find(
                          o =>
                            o.textContent
                              .trim()
                              .includes(wanted)
                        );

                      if (!option) {
                        throw new Error(
                          `Option not found: ${wanted}`
                        );
                      }

                      el.value = option.value;

                      el.dispatchEvent(
                        new Event(
                          'input',
                          { bubbles: true }
                        )
                      );

                      el.dispatchEvent(
                        new Event(
                          'change',
                          { bubbles: true }
                        )
                      );
                    },
                    text
                  );

                  await page.waitForTimeout(500);

                  return true;
                }
              }

              return false;
            }

            /*
             * STEP 3
             * Select Al-Fatihah.
             */
            const surahOK =
              await selectContaining('الفاتحة');

            if (!surahOK) {
              throw new Error(
                'لم يتم العثور على سورة الفاتحة داخل المولد الدفعي.'
              );
            }

            /*
             * STEP 4
             * Select Muhammad Jibril.
             */
            const reciterOK =
              await selectContaining('محمد جبريل');

            if (!reciterOK) {
              throw new Error(
                'لم يتم العثور على محمد جبريل بعد فتح المولد الدفعي.'
              );
            }

            /*
             * STEP 5
             * Try to select WEBM.
             */
            const webmOK =
              await selectContaining('WEBM');

            if (!webmOK) {
              console.log(
                'WEBM option was not found by text.'
              );
              console.log(
                'The export selector may use another label.'
              );
            }

            /*
             * STEP 6
             * Find visible number inputs.
             */
            const numberInputs =
              page.locator(
                'input[type="number"]:visible'
              );

            const numberCount =
              await numberInputs.count();

            console.log(
              'Visible number inputs:',
              numberCount
            );

            /*
             * The batch dialog range fields
             * are expected to be the last two
             * visible number inputs.
             */
            if (numberCount >= 2) {

              await numberInputs
                .nth(numberCount - 2)
                .fill('1');

              await numberInputs
                .nth(numberCount - 1)
                .fill('1');

              console.log(
                'Range set to Ayah 1 → Ayah 1.'
              );

            } else {

              throw new Error(
                'لم يتم العثور على حقلي بداية ونهاية الآيات.'
              );
            }

            /*
             * Screenshot before production.
             */
            await page.screenshot({
              path:
                'output/batch-before-production.png',
              fullPage: true
            });

            /*
             * STEP 7
             * Create production list.
             */
            const createList =
              page.getByRole(
                'button',
                {
                  name: 'إنشاء قائمة الإنتاج'
                }
              );

            await createList.click();

            console.log(
              'Production list requested.'
            );

            await page.waitForTimeout(15000);

            /*
             * STEP 8
             * Confirm a production item exists.
             */
            const bodyText =
              await page.locator('body').innerText();

            console.log(
              'Production list text checked.'
            );

            if (
              !bodyText.includes('قائمة الإنتاج')
            ) {
              throw new Error(
                'قائمة الإنتاج لم تظهر.'
              );
            }

            /*
             * STEP 9
             * Start production and wait for download.
             */
            console.log(
              'Starting production...'
            );

            const downloadPromise =
              page.waitForEvent(
                'download',
                {
                  timeout: 600000
                }
              );

            await page.getByRole(
              'button',
              {
                name: /بدء الإنتاج/
              }
            ).click();

            const download =
              await downloadPromise;

            const outputPath =
              'output/ayah-test.webm';

            await download.saveAs(
              outputPath
            );

            /*
             * STEP 10
             * Validate.
             */
            const stat =
              fs.statSync(outputPath);

            console.log(
              'Generated WebM:',
              stat.size,
              'bytes'
            );

            if (stat.size < 10000) {
              throw new Error(
                'ملف WebM صغير بشكل غير طبيعي.'
              );
            }

            console.log(
              'WEBM GENERATION SUCCESS'
            );

            await page.screenshot({
              path:
                'output/after-production.png',
              fullPage: true
            });

            await browser.close();

          })().catch(error => {

            console.error(
              'FINAL ERROR:',
              error
            );

            process.exit(1);

          });
          EOF

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: ayah-test-webm
          path: output/
