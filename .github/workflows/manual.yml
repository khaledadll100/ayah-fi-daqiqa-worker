
    
  
             * 17. WAIT FOR WEBM DOWNLOAD
             * ==========================================
             */

            const download =
              await downloadPromise;

            console.log(
              'Download detected.'
            );

            console.log(
              'Suggested filename:',
              download.suggestedFilename()
            );

            const outputPath =
              'output/ayah-test.webm';

            await download.saveAs(
              outputPath
            );

            /*
             * ==========================================
             * 18. VALIDATE WEBM
             * ==========================================
             */

            if (
              !fs.existsSync(outputPath)
            ) {

              throw new Error(
                'WebM file was not created.'
              );

            }

            const stat =
              fs.statSync(outputPath);

            console.log(
              'WEBM SIZE:',
              stat.size,
              'bytes'
            );

            if (
              stat.size < 10000
            ) {

              throw new Error(
                'WebM file is too small.'
              );

            }

            /*
             * ==========================================
             * 19. FINAL SCREENSHOT
             * ==========================================
             */

            await page.screenshot({
              path:
                'output/after-production.png',
              fullPage: true
            });

            console.log(
              '================================'
            );

            console.log(
              'WEBM GENERATION SUCCESS'
            );

            console.log(
              '================================'
            );

            await browser.close();

          })().catch(error => {

            console.error(
              'FINAL ERROR:',
              error
            );

            process.exit(1);

          });

          EOF

      - name: Upload WebM to Hosting
        env:
          AYAH_API_KEY: ${{ secrets.AYAH_API_KEY }}
        run: |
          echo "Uploading WebM to hosting..."

          curl -sS             --fail-with-body             --retry 2             --retry-delay 2             -X POST             -H "X-API-Key: ${AYAH_API_KEY}"             -F "file=@output/ayah-test.webm;type=video/webm"             "https://khaled.elevatefollowers.com/ingest.php"             -o output/upload-response.json

          echo "Server response:"
          cat output/upload-response.json

          jq -e '.success == true' output/upload-response.json > /dev/null

          echo "================================"
          echo "WEBM UPLOAD SUCCESS"
          echo "================================"

      - name: Upload generated WebM
        uses: actions/upload-artifact@v6
        with:
          name: ayah-first-webm
          path: output/
          if-no-files-found: error
