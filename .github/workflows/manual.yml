name: Inspect Batch Generator

on:
  workflow_dispatch:

jobs:
  inspect-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright

      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium

      - name: Open Batch Generator
        run: |
          mkdir -p output

          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {

            const browser = await chromium.launch({
              headless: true,
              args: [
                '--autoplay-policy=no-user-gesture-required'
              ]
            });

            const context = await browser.newContext({
              viewport: {
                width: 1080,
                height: 1920
              }
            });

            const page = await context.newPage();

            page.on('console', msg => {
              console.log(
                '[BROWSER]',
                msg.type(),
                msg.text()
              );
            });

            page.on('pageerror', error => {
              console.error(
                '[PAGE ERROR]',
                error.message
              );
            });

            console.log('Opening site...');

            await page.goto(
              'https://khaled.elevatefollowers.com/',
              {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              }
            );

            await page.waitForTimeout(10000);

            console.log('Site loaded.');

            /*
             * Find the actual batch-generator button
             * by its text instead of accessible role.
             */
            const buttons = page.locator('button');

            const buttonCount =
              await buttons.count();

            console.log(
              'Total buttons:',
              buttonCount
            );

            let batchIndex = -1;

            for (let i = 0; i < buttonCount; i++) {

              const text =
                (await buttons.nth(i).innerText())
                  .trim();

              if (
                text.includes(
                  'مولد فيديوهات القرآن التلقائي'
                )
              ) {

                console.log(
                  'FOUND BATCH BUTTON:',
                  text
                );

                batchIndex = i;
                break;
              }
            }

            if (batchIndex === -1) {

              console.log(
                'Batch button was not found.'
              );

              console.log(
                'Available buttons:'
              );

              for (
                let i = 0;
                i < Math.min(buttonCount, 100);
                i++
              ) {

                console.log(
                  i,
                  (await buttons.nth(i).innerText())
                    .trim()
                );
              }

              throw new Error(
                'Batch generator button not found.'
              );
            }

            /*
             * Scroll to the button.
             */
            await buttons
              .nth(batchIndex)
              .scrollIntoViewIfNeeded();

            /*
             * Try normal click first.
             */
            try {

              await buttons
                .nth(batchIndex)
                .click({
                  timeout: 10000
                });

            } catch (error) {

              console.log(
                'Normal click failed.'
              );

              console.log(
                'Trying DOM click...'
              );

              await buttons
                .nth(batchIndex)
                .evaluate(
                  el => el.click()
                );
            }

            console.log(
              'Batch button clicked.'
            );

            /*
             * Wait for the batch dialog.
             */
            await page.waitForTimeout(4000);

            /*
             * Verify the batch interface.
             */
            const bodyText =
              await page.locator('body')
                .innerText();

            console.log(
              'Batch interface check:'
            );

            console.log(
              bodyText.includes(
                'صيغة الإخراج'
              )
                ? 'Output selector FOUND'
                : 'Output selector NOT FOUND'
            );

            console.log(
              bodyText.includes(
                'بدء الإنتاج'
              )
                ? 'Start production button FOUND'
                : 'Start production button NOT FOUND'
            );

            /*
             * Count selects after opening.
             */
            const selects =
              page.locator('select');

            const selectCount =
              await selects.count();

            console.log(
              'Select count after opening:',
              selectCount
            );

            for (
              let i = 0;
              i < selectCount;
              i++
            ) {

              const select =
                selects.nth(i);

              const visible =
                await select.isVisible()
                  .catch(() => false);

              if (!visible) {
                continue;
              }

              const options =
                await select
                  .locator('option')
                  .allTextContents();

              console.log(
                `SELECT ${i}:`,
                options
                  .map(x => x.trim())
                  .filter(Boolean)
                  .slice(0, 20)
                  .join(' | ')
              );
            }

            /*
             * Save screenshot.
             */
            await page.screenshot({
              path:
                'output/batch-generator.png',
              fullPage: true
            });

            console.log(
              'BATCH GENERATOR OPENED SUCCESSFULLY'
            );

            await browser.close();

          })().catch(error => {

            console.error(
              'FINAL ERROR:',
              error
            );

            process.exit(1);

          });
          EOF

      - name: Upload diagnostic screenshot
        uses: actions/upload-artifact@v4
        with:
          name: batch-generator-test
          path: output/
