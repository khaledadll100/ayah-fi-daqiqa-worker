name: Test Batch Generator

on:
  workflow_dispatch:

jobs:
  test-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright

      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium

      - name: Open Batch Generator
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {

            const browser = await chromium.launch({
              headless: true,
              args: [
                '--autoplay-policy=no-user-gesture-required'
              ]
            });

            const page = await browser.newPage({
              viewport: {
                width: 1080,
                height: 1920
              }
            });

            console.log('Opening Ayah Fi Daqiqa...');

            await page.goto(
              'https://khaled.elevatefollowers.com/',
              {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              }
            );

            await page.waitForTimeout(10000);

            console.log('Site loaded.');

            /*
             * Find the batch button regardless of
             * whether CSS considers it visible.
             */
            const batchButtons =
              page.locator('button').filter({
                hasText: 'مولد فيديوهات القرآن التلقائي'
              });

            const count =
              await batchButtons.count();

            console.log(
              'Batch buttons found:',
              count
            );

            if (count === 0) {
              throw new Error(
                'Batch generator button was not found.'
              );
            }

            /*
             * Direct DOM click.
             * We deliberately do NOT use:
             * click()
             * scrollIntoView()
             * visibility checks
             */
            await batchButtons
              .first()
              .evaluate(button => {
                button.click();
              });

            console.log(
              'Batch button DOM click executed.'
            );

            /*
             * Give the application time to
             * open the generator.
             */
            await page.waitForTimeout(5000);

            const text =
              await page.locator('body').innerText();

            console.log(
              'Output selector found:',
              text.includes('صيغة الإخراج')
            );

            console.log(
              'Create list button found:',
              text.includes('إنشاء قائمة الإنتاج')
            );

            console.log(
              'Start production found:',
              text.includes('بدء الإنتاج')
            );

            /*
             * Inspect selects AFTER opening.
             */
            const selects =
              await page.locator('select')
                .evaluateAll(elements =>
                  elements.map((el, index) => ({
                    index,
                    visible:
                      !!(
                        el.offsetWidth ||
                        el.offsetHeight ||
                        el.getClientRects().length
                      ),
                    options:
                      [...el.options]
                        .map(o =>
                          o.textContent.trim()
                        )
                        .filter(Boolean)
                        .slice(0, 25)
                  }))
                );

            console.log(
              'SELECT INFORMATION:'
            );

            console.log(
              JSON.stringify(
                selects,
                null,
                2
              )
            );

            console.log(
              'BATCH GENERATOR TEST COMPLETE'
            );

            await browser.close();

          })().catch(error => {

            console.error(
              'FINAL ERROR:',
              error
            );

            process.exit(1);

          });
          EOF
