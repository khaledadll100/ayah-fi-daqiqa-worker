name: Test Batch Generator

on:
  workflow_dispatch:

jobs:
  test-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright

      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium

      - name: Test Batch Generator
        run: |
          mkdir -p output

          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {

            const browser = await chromium.launch({
              headless: true,
              args: [
                '--autoplay-policy=no-user-gesture-required'
              ]
            });

            const context = await browser.newContext({
              viewport: {
                width: 1080,
                height: 1920
              }
            });

            const page = await context.newPage();

            page.on('console', msg => {
              console.log(
                '[BROWSER]',
                msg.type(),
                msg.text()
              );
            });

            page.on('pageerror', error => {
              console.error(
                '[PAGE ERROR]',
                error.message
              );
            });

            console.log('Opening Ayah Fi Daqiqa...');

            await page.goto(
              'https://khaled.elevatefollowers.com/',
              {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              }
            );

            await page.waitForTimeout(10000);

            console.log('Site loaded.');

            /*
             * Find ALL matching batch-generator buttons.
             */
            const matches = await page.locator('button').evaluateAll(
              buttons => {

                return buttons
                  .map((button, index) => {

                    const text =
                      (button.innerText || '')
                        .trim();

                    if (
                      !text.includes(
                        'مولد فيديوهات القرآن التلقائي'
                      )
                    ) {
                      return null;
                    }

                    const rect =
                      button.getBoundingClientRect();

                    const style =
                      window.getComputedStyle(button);

                    return {
                      index,
                      text,
                      display: style.display,
                      visibility: style.visibility,
                      opacity: style.opacity,
                      width: rect.width,
                      height: rect.height,
                      top: rect.top,
                      left: rect.left,
                      disabled: button.disabled,
                      ariaHidden:
                        button.getAttribute(
                          'aria-hidden'
                        )
                    };

                  })
                  .filter(Boolean);
              }
            );

            console.log(
              'Matching batch buttons:',
              JSON.stringify(matches, null, 2)
            );

            /*
             * Find the FIRST actually visible button.
             */
            const visibleIndex =
              matches.find(
                item =>
                  item.display !== 'none' &&
                  item.visibility !== 'hidden' &&
                  Number(item.opacity) > 0 &&
                  item.width > 0 &&
                  item.height > 0 &&
                  item.ariaHidden !== 'true' &&
                  !item.disabled
              );

            if (!visibleIndex) {

              throw new Error(
                'No visible batch-generator button found.'
              );
            }

            console.log(
              'VISIBLE BATCH BUTTON:',
              JSON.stringify(
                visibleIndex,
                null,
                2
              )
            );

            /*
             * Click directly through the DOM.
             * This avoids Playwright's visibility/scroll
             * checks on hidden duplicate elements.
             */
            const clicked =
              await page.locator('button').nth(
                visibleIndex.index
              ).evaluate(button => {

                button.click();

                return true;
              });

            console.log(
              'Batch button DOM click:',
              clicked
            );

            /*
             * Wait for modal initialization.
             */
            await page.waitForTimeout(5000);

            /*
             * Check whether the batch dialog appeared.
             */
            const bodyText =
              await page.locator('body')
                .innerText();

            console.log(
              'Checking batch interface...'
            );

            console.log(
              'صيغة الإخراج:',
              bodyText.includes('صيغة الإخراج')
            );

            console.log(
              'بدء الإنتاج:',
              bodyText.includes('بدء الإنتاج')
            );

            console.log(
              'إنشاء قائمة الإنتاج:',
              bodyText.includes('إنشاء قائمة الإنتاج')
            );

            /*
             * Inspect SELECT elements.
             */
            const selects =
              await page.locator('select')
                .evaluateAll(
                  elements => {

                    return elements.map(
                      (select, index) => {

                        const rect =
                          select.getBoundingClientRect();

                        const style =
                          window.getComputedStyle(
                            select
                          );

                        return {
                          index,
                          visible:
                            style.display !== 'none' &&
                            style.visibility !== 'hidden' &&
                            rect.width > 0 &&
                            rect.height > 0,
                          options:
                            [...select.options]
                              .map(
                                option =>
                                  option.textContent
                                    .trim()
                              )
                              .slice(0, 30)
                        };

                      }
                    );
                  }
                );

            console.log(
              'SELECT INFORMATION:'
            );

            console.log(
              JSON.stringify(
                selects,
                null,
                2
              )
            );

            /*
             * Save diagnostic screenshot.
             */
            await page.screenshot({
              path:
                'output/batch-generator.png',
              fullPage: true
            });

            console.log(
              'BATCH GENERATOR TEST SUCCESS'
            );

            await browser.close();

          })().catch(error => {

            console.error(
              'FINAL ERROR:',
              error
            );

            process.exit(1);

          });
          EOF

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: batch-generator-diagnostic
          path: output/
